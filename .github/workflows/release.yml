name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.4
        required: true
        default: 1.0.4

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Set firmware version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          path = Path("src/update_manager.h")
          text = path.read_text()
          old = '#define EMLALOCK_VERSION "1.0.0"'
          new = f'#define EMLALOCK_VERSION "{version}"'
          if old not in text:
              raise SystemExit("Expected EMLALOCK_VERSION definition was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build ESP32
        run: |
          pio run -e esp32dev
          cp .pio/build/esp32dev/firmware.bin "EmlaLock-${{ inputs.version }}-esp32.bin"

      - name: Build ESP32-C3
        run: |
          pio run -e esp32-c3-devkitm-1
          cp .pio/build/esp32-c3-devkitm-1/firmware.bin "EmlaLock-${{ inputs.version }}-esp32c3.bin"

      - name: Build ESP32-S2
        run: |
          pio run -e esp32-s2-saola-1
          cp .pio/build/esp32-s2-saola-1/firmware.bin "EmlaLock-${{ inputs.version }}-esp32s2.bin"

      - name: Build ESP32-S3
        run: |
          pio run -e esp32-s3-devkitc-1
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin "EmlaLock-${{ inputs.version }}-esp32s3.bin"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "EmlaLock-${VERSION}-esp32.bin" \
            "EmlaLock-${VERSION}-esp32c3.bin" \
            "EmlaLock-${VERSION}-esp32s2.bin" \
            "EmlaLock-${VERSION}-esp32s3.bin" \
            --title "EmlaLock v${VERSION}" \
            --generate-notes
