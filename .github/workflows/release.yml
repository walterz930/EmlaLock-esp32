name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.5
        required: true
        default: 1.0.5

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export PLATFORMIO_BUILD_FLAGS="-DEMLALOCK_VERSION=\"${VERSION}\""
          pio run -e esp32dev
          cp .pio/build/esp32dev/firmware.bin "EmlaLock-${VERSION}-esp32.bin"
          pio run -e esp32-c3-devkitm-1
          cp .pio/build/esp32-c3-devkitm-1/firmware.bin "EmlaLock-${VERSION}-esp32c3.bin"
          pio run -e esp32-s2-saola-1
          cp .pio/build/esp32-s2-saola-1/firmware.bin "EmlaLock-${VERSION}-esp32s2.bin"
          pio run -e esp32-s3-devkitc-1
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin "EmlaLock-${VERSION}-esp32s3.bin"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "EmlaLock-${VERSION}-esp32.bin" \
            "EmlaLock-${VERSION}-esp32c3.bin" \
            "EmlaLock-${VERSION}-esp32s2.bin" \
            "EmlaLock-${VERSION}-esp32s3.bin" \
            --title "EmlaLock v${VERSION}" \
            --generate-notes
